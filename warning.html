<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulse Chat - Content Warning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      height: 100vh;
      background: #140507;
      color: #fff1f2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .warn-box {
      max-width: 440px;
      background: #2b090e;
      border: 2px solid #f43f5e;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(244, 63, 94, 0.35);
    }
    .icon { font-size: 3.5rem; margin-bottom: 12px; }
    h1 { color: #fb7185; font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #fecdd3; font-size: 0.95rem; line-height: 1.5; margin-bottom: 18px; }
    .phrase-pill {
      display: inline-block;
      background: #4c0519;
      border: 1px solid #f43f5e;
      padding: 4px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
    }
    button {
      background: #f43f5e;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #e11d48; }
  </style>
</head>
<body>
  <div class="warn-box">
    <div class="icon">⚠️</div>
    <h1>Message Blocked: Restricted Phrase</h1>
    <p>Your message was blocked because it contained a banned phrase on Pulse Chat. Please keep chats respectful and follow server rules.</p>
    <div class="phrase-pill" id="blockedReason">Restricted Phrase Detected</div>
    <br>
    <button id="ackBtn">I Understand — Return to Chat</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const term = params.get('term');
    if (term) document.getElementById('blockedReason').textContent = `Blocked Term: "${term}"`;
    document.getElementById('ackBtn').onclick = () => window.close();
  </script>
</body>
</html>
